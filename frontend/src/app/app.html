<header>
  <a routerLink="/" class="logo" aria-label="TK3 Tournament Manager, inicio">TK<b>3</b> ♪</a>
  @if (auth.usuario(); as usuario) {
    <nav>
      <a routerLink="/torneos" routerLinkActive="activo" style="--color: var(--coral)">Torneos</a>
      <a routerLink="/estadisticas" routerLinkActive="activo" style="--color: var(--amarillo)"
        >Estadísticas</a
      >
      <a routerLink="/practica" routerLinkActive="activo" style="--color: var(--menta)">Práctica</a>
      <a routerLink="/participantes" routerLinkActive="activo" style="--color: var(--azul)"
        >Participantes</a
      >
    </nav>
    <div class="sesion">
      <span class="usuario">
        <span class="inicial" aria-hidden="true">{{ usuario.nombre_usuario.charAt(0) }}</span>
        {{ usuario.nombre_usuario }}
      </span>
      <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
