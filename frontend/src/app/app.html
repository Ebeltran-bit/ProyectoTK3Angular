<header>
  <a routerLink="/" class="logo" aria-label="TK3 Tournament Manager, inicio">TK<b>3</b> ♪</a>
  @if (auth.usuario(); as usuario) {
    <nav>
      <a routerLink="/torneos" routerLinkActive="activo" style="--color: var(--coral)">Torneos</a>
      <a routerLink="/estadisticas" routerLinkActive="activo" style="--color: var(--amarillo)"
        >Estadísticas</a
      >
      <a routerLink="/practica" routerLinkActive="activo" style="--color: var(--menta)">Práctica</a>
      <a routerLink="/participantes" routerLinkActive="activo" style="--color: var(--azul)"
        >Participantes</a
      >
    </nav>
    <div class="sesion">
      <button
        type="button"
        class="usuario"
        [attr.aria-expanded]="eligiendo()"
        aria-controls="selector-icono"
        title="Cambiar icono"
        (click)="eligiendo.set(!eligiendo())"
      >
        <app-icono-usuario [icono]="usuario.icono" [nombre]="usuario.nombre_usuario" />
        {{ usuario.nombre_usuario }}
      </button>
      <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
      @if (eligiendo()) {
        <div class="selector" id="selector-icono" role="dialog" aria-label="Elige tu icono">
          <p class="titulo-selector">Elige tu icono</p>
          <div class="opciones">
            @for (i of iconos; track i.id) {
              <button
                type="button"
                class="opcion"
                [class.elegido]="usuario.icono === i.id"
                [attr.aria-pressed]="usuario.icono === i.id"
                [title]="i.nombre"
                (click)="elegirIcono(i.id)"
              >
                <app-icono-usuario [icono]="i.id" [tam]="52" />
              </button>
            }
          </div>
          @if (errorIcono()) {
            <p class="mensaje-error">{{ errorIcono() }}</p>
          }
          <div class="pie-selector">
            <button type="button" (click)="elegirIcono(null)">Usar mi inicial</button>
            <button type="button" (click)="eligiendo.set(false)">Cerrar</button>
          </div>
        </div>
      }
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
