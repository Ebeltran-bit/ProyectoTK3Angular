<header>
  <h1>TK3 Tournament Manager</h1>
  @if (auth.usuario(); as usuario) {
    <nav>
      <a routerLink="/participantes" routerLinkActive="activo">Participantes</a>
      <a routerLink="/torneos" routerLinkActive="activo">Torneos</a>
      <a routerLink="/personaje" routerLinkActive="activo">Mi personaje</a>
      <a routerLink="/combate" routerLinkActive="activo">Combate</a>
    </nav>
    <div class="sesion">
      <span>{{ usuario.nombre_usuario }}</span>
      <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
