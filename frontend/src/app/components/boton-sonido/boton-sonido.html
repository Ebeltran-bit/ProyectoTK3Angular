@if (abierto()) {
  <div class="panel" id="panel-sonido" role="group" aria-label="Sonido">
    <p class="titulo">Sonido</p>
    <app-controles-sonido />
    <small>Se guarda en este navegador. Mientras suena la canción, M silencia.</small>
  </div>
}
<button
  type="button"
  class="boton"
  [attr.aria-expanded]="abierto()"
  aria-controls="panel-sonido"
  [attr.aria-label]="silencio() ? 'Sonido (silenciado)' : 'Sonido'"
  (click)="abierto.set(!abierto())"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
    @if (silencio()) {
      <path
        d="M16 9l5 6M21 9l-5 6"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
      />
    } @else {
      <path
        d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
      />
    }
  </svg>
</button>
